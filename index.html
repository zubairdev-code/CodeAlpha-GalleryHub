<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumière Gallery</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="site-header">
  <div class="header-left">
    <span class="tagline">Visual Archive</span>
    <h1 class="logo">Gall<em>è</em>ry</h1>
  </div>
  <div class="header-right">

    <button class="icon-btn" id="searchToggle" title="Search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>

    <button class="icon-btn" id="favToggle" title="Show favourites">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </button>

    <button class="upload-btn" id="uploadBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Add Photos
    </button>

    <input type="file" id="fileInput" accept="image/*" multiple hidden />
  </div>
</header>

<!-- ══ SEARCH BAR ══ -->
<div class="search-wrap" id="searchWrap">
  <div class="search-inner">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search by title or category…" autocomplete="off" />
  </div>
</div>

<!-- ══ FILTER BAR ══ -->
<nav class="filter-bar" id="filterBar">
  <span class="filter-label">Filter</span>

  <button class="filter-btn active" data-cat="all">
    All <span class="filter-count" id="cnt-all">0</span>
  </button>

  <button class="filter-btn" data-cat="nature">
    Nature <span class="filter-count" id="cnt-nature">0</span>
  </button>

  <button class="filter-btn" data-cat="architecture">
    Architecture <span class="filter-count" id="cnt-architecture">0</span>
  </button>

  <button class="filter-btn" data-cat="portrait">
    Portrait <span class="filter-count" id="cnt-portrait">0</span>
  </button>

  <button class="filter-btn" data-cat="abstract">
    Abstract <span class="filter-count" id="cnt-abstract">0</span>
  </button>

  <button class="filter-btn" data-cat="travel">
    Travel <span class="filter-count" id="cnt-travel">0</span>
  </button>

  <button class="filter-btn" data-cat="other">
    Other <span class="filter-count" id="cnt-other">0</span>
  </button>
</nav>

<!-- ══ CONTROLS BAR ══ -->
<div class="controls-bar">
  <div class="gallery-count" id="galleryCount"></div>

  <div class="controls-right">

    <select class="sort-select" id="sortSelect">
      <option value="default">Sort: Default</option>
      <option value="title-asc">Title A→Z</option>
      <option value="title-desc">Title Z→A</option>
      <option value="cat-asc">Category A→Z</option>
      <option value="date-desc">Date: Newest</option>
      <option value="date-asc">Date: Oldest</option>
    </select>

    <div class="view-toggle">
      <button class="view-btn active" data-cols="4" title="4 columns">▦</button>
      <button class="view-btn" data-cols="3" title="3 columns">⊞</button>
      <button class="view-btn" data-cols="2" title="2 columns">▤</button>
      <button class="view-btn" data-cols="list" title="List view">☰</button>
    </div>

  </div>
</div>

<!-- ══ GALLERY ══ -->
<main class="gallery-wrap">

  <div class="gallery" id="gallery"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>

    <p id="emptyMsg">No photos yet</p>
    <button id="emptyAddBtn">Add Photos</button>
  </div>

</main>

<!-- ══ ADD IMAGE MODAL ══ -->
<div class="modal-overlay" id="addModal">

  <div class="modal">

    <div class="modal-header">

      <div>
        <h2 class="modal-title">Add New Photo</h2>
        <p class="modal-subtitle">Supported: JPG, PNG, GIF, WebP</p>
      </div>

      <button class="modal-close" id="modalClose">✕</button>

    </div>

    <div class="drop-zone" id="dropZone">

      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>

      <p>Drag &amp; drop images here</p>
      <span>or</span>

      <label class="browse-btn" for="fileInput">Browse Files</label>

      <small>Multiple files supported</small>
    </div>

    <div class="preview-area" id="previewArea"></div>

    <div class="img-form" id="imgForm" style="display:none;">

      <div class="form-row">
        <label>Title</label>
        <input type="text" id="imgTitle" placeholder="Enter image title…" maxlength="80" />
        <span class="char-count" id="titleCharCount">0 / 80</span>
      </div>

      <div class="form-row">
        <label>Category</label>

        <select id="imgCategory">
          <option value="nature">Nature</option>
          <option value="architecture">Architecture</option>
          <option value="portrait">Portrait</option>
          <option value="abstract">Abstract</option>
          <option value="travel">Travel</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <label>Description <span style="color:var(--muted2);font-size:0.6rem">(optional)</span></label>

        <textarea id="imgDesc" placeholder="Add a description…" maxlength="300" rows="2"></textarea>
      </div>

      <div class="upload-progress" id="uploadProgress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <button class="add-confirm-btn" id="addConfirmBtn">
        Add to Gallery
      </button>

    </div>

  </div>
</div>

<!-- ══ LIGHTBOX ══ -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">

  <button id="lbClose" title="Close (Esc)">✕</button>
  <button class="lb-arrow" id="lbPrev" title="Previous (←)">&#8592;</button>

  <div class="lb-inner">

    <img id="lbImg" src="" alt="" class="zoomable" />

    <div class="lb-toolbar">

<button class="lb-tool-btn" id="lbZoom" title="Zoom">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="8"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    <line x1="11" y1="8" x2="11" y2="14"/>
    <line x1="8" y1="11" x2="14" y2="11"/>
  </svg>
</button>

<button class="lb-tool-btn" id="lbDownload" title="Download">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
</button>

      <button class="lb-tool-btn" id="lbFav" title="Favourite">
        ★
      </button>

    </div>

    <div class="lb-info">

      <div class="lb-title" id="lbTitle"></div>

      <div class="lb-meta">
        <span class="lb-cat" id="lbCat"></span>
        <span class="lb-counter" id="lbCounter"></span>
      </div>

      <div id="lbDesc"></div>

    </div>

  </div>

  <button class="lb-arrow" id="lbNext" title="Next (→)">&#8594;</button>

</div>

<!-- ══ TOAST ══ -->
<div id="toastContainer"></div>

<!-- ══ FOOTER ══ -->
<footer class="site-footer">
  <span>© 2026 Lumière Gallery</span>
  <span class="sep">—</span>
  <span id="footerCount">0 photos</span>
</footer>

<!-- External JS -->
<script src="script.js"></script>

</body>
</html>
